<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>JARVIS</title>
<style>
:root{color-scheme:dark;--blue:#42c8ff;--cyan:#8deaff;--muted:#8da8c2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 37%,#102b4b 0,#071426 38%,#030711 78%);color:#eaf8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
.app{max-width:560px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(88px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 2px 12px}
.brand{letter-spacing:.22em;font-size:13px;color:var(--cyan);font-weight:700}
.clock{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:#b8d7ed}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0 18px}
.status{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:28px}
.orb-wrap{width:min(72vw,290px);aspect-ratio:1;display:grid;place-items:center;position:relative;margin-bottom:28px}
.orb-wrap:before,.orb-wrap:after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid #37bfff55;box-shadow:0 0 26px #149fe955,inset 0 0 28px #149fe922}
.orb-wrap:after{inset:13px;border-color:#73e5ff88;box-shadow:0 0 35px #19baff44,inset 0 0 30px #19baff22;animation:spin 18s linear infinite}
.orb{width:66%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,#7deaff 0,#1689c9 18%,#075080 43%,#061b34 72%);box-shadow:0 0 25px #3acaffaa,0 0 70px #168bdb66,inset 0 0 30px #a5f5ff55;position:relative;animation:pulse 3s ease-in-out infinite}
.orb:before,.orb:after{content:"";position:absolute;inset:-20px;border-radius:50%;border:1px dashed #65dfff88;animation:spin 22s linear infinite}
.orb:after{inset:-36px;border-style:solid;border-color:#4fcfff33 transparent #4fcfff66 transparent;animation-direction:reverse;animation-duration:12s}
body.listening .orb{animation:pulse .65s ease-in-out infinite;box-shadow:0 0 40px #5de6ff,0 0 100px #168bdb}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.045);filter:brightness(1.25)}}
.greeting{font-size:24px;font-weight:300;letter-spacing:.04em;text-align:center}
.sub{color:var(--muted);font-size:13px;margin-top:9px;text-align:center}
.controls{display:flex;gap:14px;align-items:center;justify-content:center;margin:8px 0 22px}
button{font:inherit;color:inherit;border:1px solid #4ccaff66;background:#0b2037;border-radius:999px;padding:12px 18px;cursor:pointer}
button:active{transform:scale(.97)}
.mic{width:68px;height:68px;font-size:24px;border:1px solid #73e5ff;background:linear-gradient(145deg,#145b83,#071b32);box-shadow:0 0 25px #1ba9e955}
.secondary{font-size:12px;color:#b7d8eb}
.panel{border:1px solid #3cb8e944;background:#071525cc;border-radius:18px;padding:14px;margin-top:8px}
.panel-title{font-size:11px;letter-spacing:.18em;color:var(--cyan);margin-bottom:10px}
#conversation{max-height:190px;overflow:auto;font-size:14px;line-height:1.5;color:#d8efff}
.msg{padding:8px 0;border-bottom:1px solid #ffffff10}.who{color:var(--cyan);font-size:10px;letter-spacing:.12em}
form{display:flex;gap:8px;margin-top:12px}
input{min-width:0;flex:1;background:#020a14;border:1px solid #347ba366;border-radius:999px;padding:13px 15px;color:white;font-size:14px;outline:none}
.send{padding:0 17px}
nav{position:fixed;bottom:0;left:0;right:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;background:#030914ed;border-top:1px solid #3cb8e933;backdrop-filter:blur(14px)}
nav button{font-size:12px;padding:10px 14px;color:#b8d8ec;background:#0a192a}
.note{font-size:10px;color:#718ba3;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">J.A.R.V.I.S.</div><div class="clock"><div id="time">--:--</div><div id="date">Loading date</div></div></header>
<main>
<div class="status" id="status">SYSTEM ONLINE</div>
<div class="orb-wrap"><div class="orb"></div></div>
<div class="greeting">At your service.</div>
<div class="sub">Your personal assistant interface</div>
<div class="controls"><button class="mic" id="mic" aria-label="Start voice input">🎙</button></div>
<div class="secondary" id="hint">Tap the microphone to speak, or type below.</div>
</main>
<section class="panel">
<div class="panel-title">CONVERSATION</div>
<div id="conversation"><div class="msg"><div class="who">JARVIS</div>Good day. How may I assist you?</div></div>
<form id="chat"><input id="entry" placeholder="Message JARVIS…" autocomplete="off"><button class="send" type="submit">Send</button></form>
<div class="note">Demo interface. Connect an AI service to enable intelligent replies.</div>
</section>
</div>
<nav><button data-tab="HOME">⌂ Home</button><button data-tab="ASSISTANT">◉ Assistant</button><button data-tab="TASKS">✓ Tasks</button><button data-tab="SETTINGS">⚙ Settings</button></nav>
<script>
const $=s=>document.querySelector(s);
function tick(){const d=new Date();$('#time').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short',year:'numeric'});}
tick();setInterval(tick,1000);
function add(who,text){const el=document.createElement('div');el.className='msg';const label=document.createElement('div');label.className='who';label.textContent=who;const body=document.createElement('div');body.textContent=text;el.append(label,body);$('#conversation').append(el);$('#conversation').scrollTop=$('#conversation').scrollHeight;}
$('#chat').addEventListener('submit',e=>{e.preventDefault();const v=$('#entry').value.trim();if(!v)return;add('YOU',v);$('#entry').value='';add('JARVIS','This interface is running, but an AI service has not been connected yet.');});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.tab;if(t==='TASKS')add('JARVIS','Tasks panel is a placeholder. Task integration can be added later.');else if(t==='SETTINGS')add('JARVIS','Settings: voice output and AI connection can be configured in a later step.');else add('JARVIS',t==='HOME'?'Home screen active.':'Assistant screen active.');}));
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#mic').addEventListener('click',()=>{if(!SpeechRecognition){$('#hint').textContent='Voice recognition is not supported in this browser. You can type a message instead.';return;}const r=new SpeechRecognition();r.lang='en-ZA';r.interimResults=false;r.onstart=()=>{document.body.classList.add('listening');$('#status').textContent='LISTENING';$('#hint').textContent='I am listening…';};r.onresult=e=>{$('#entry').value=e.results[0][0].transcript;$('#hint').textContent='Speech captured. Tap Send to add it.';};r.onerror=()=>{$('#hint').textContent='Could not hear that. Please try again or type.';};r.onend=()=>{document.body.classList.remove('listening');$('#status').textContent='SYSTEM ONLINE';};r.start();});
</script>
</body>
</html>
