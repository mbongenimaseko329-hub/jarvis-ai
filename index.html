
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>JARVIS AI</title>

<style>
:root {
  color-scheme: dark;
  --blue: #42c8ff;
  --cyan: #8deaff;
  --muted: #8da8c2;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 37%, #102b4b 0, #071426 38%, #030711 78%);
  color: #eaf8ff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  max-width: 560px;
  margin: auto;
  min-height: 100vh;
  padding: env(safe-area-inset-top) 18px calc(88px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 2px 12px;
}
.brand {
  letter-spacing: .22em;
  font-size: 13px;
  color: var(--cyan);
  font-weight: 700;
}
.clock {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: #b8d7ed;
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 0 18px;
}
.status {
  font-size: 12px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 28px;
}
.orb-wrap {
  width: min(72vw, 290px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  position: relative;
  margin-bottom: 28px;
}
.orb-wrap:before, .orb-wrap:after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid #37bfff55;
  box-shadow: 0 0 26px #149fe955, inset 0 0 28px #149fe922;
}
.orb-wrap:after {
  inset: 13px;
  border-color: #73e5ff88;
  animation: spin 18s linear infinite;
}
.orb {
  width: 66%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #7deaff 0, #1689c9 18%, #075080 43%, #061b34 72%);
  box-shadow: 0 0 25px #3acaffaa, 0 0 70px #168bdb66, inset 0 0 30px #a5f5ff55;
  position: relative;
  animation: pulse 3s ease-in-out infinite;
}
.orb:before, .orb:after {
  content: "";
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  border: 1px dashed #65dfff88;
  animation: spin 22s linear infinite;
}
.orb:after {
  inset: -36px;
  border-style: solid;
  border-color: #4fcfff33 transparent #4fcfff66 transparent;
  animation-direction: reverse;
  animation-duration: 12s;
}
body.listening .orb {
  animation: pulse .65s ease-in-out infinite;
  box-shadow: 0 0 40px #5de6ff, 0 0 100px #168bdb;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse {
  50% { transform: scale(1.045); filter: brightness(1.25); }
}

.greeting {
  font-size: 24px;
  font-weight: 300;
  letter-spacing: .04em;
  text-align: center;
}
.sub {
  color: var(--muted);
  font-size: 13px;
  margin-top: 9px;
  text-align: center;
}
.controls {
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: center;
  margin: 18px 0;
}
button {
  font: inherit;
  color: inherit;
  border: 1px solid #4ccaff66;
  background: #0b2037;
  border-radius: 999px;
  padding: 12px 18px;
  cursor: pointer;
}
button:active { transform: scale(.97); }
.mic {
  width: 68px;
  height: 68px;
  font-size: 24px;
  border: 1px solid #73e5ff;
  background: linear-gradient(145deg, #145b83, #071b32);
  box-shadow: 0 0 25px #1ba9e955;
}
.secondary {
  font-size: 12px;
  color: #b7d8eb;
  text-align: center;
}

.panel {
  border: 1px solid #3cb8e944;
  background: #071525cc;
  border-radius: 18px;
  padding: 14px;
  margin-top: 8px;
}
.panel-title {
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--cyan);
  margin-bottom: 10px;
}
#conversation {
  max-height: 190px;
  overflow: auto;
  font-size: 14px;
  line-height: 1.5;
  color: #d8efff;
}
.msg {
  padding: 8px 0;
  border-bottom: 1px solid #ffffff10;
}
.who {
  color: var(--cyan);
  font-size: 10px;
  letter-spacing: .12em;
}
form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
input {
  min-width: 0;
  flex: 1;
  background: #020a14;
  border: 1px solid #347ba366;
  border-radius: 999px;
  padding: 13px 15px;
  color: white;
  font-size: 14px;
  outline: none;
}
.send { padding: 0 17px; }
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  gap: 8px;
  background: #030914ed;
  border-top: 1px solid #3cb8e933;
  backdrop-filter: blur(14px);
}
nav button {
  font-size: 12px;
  padding: 10px 14px;
  color: #b8d8ec;
  background: #0a192a;
}
.note {
  font-size: 10px;
  color: #718ba3;
  text-align: center;
  margin-top: 12px;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">J.A.R.V.I.S.</div>
  <div class="clock">
    <div id="time">--:--</div>
    <div id="date">Loading date</div>
  </div>
</header>

<main>
  <div class="status" id="status">SYSTEM ONLINE</div>
  <div class="orb-wrap"><div class="orb"></div></div>
  <div class="greeting">At your service.</div>
  <div class="sub">Your personal AI assistant</div>

  <div class="controls">
    <button class="mic" id="mic" aria-label="Start voice mode">🎙</button>
  </div>

  <div class="secondary" id="hint">
    Tap the microphone to start voice mode.
  </div>
</main>

<section class="panel">
  <div class="panel-title">CONVERSATION</div>

  <div id="conversation">
    <div class="msg">
      <div class="who">JARVIS</div>
      Good day. How may I assist you?
    </div>
  </div>

  <form id="chat">
    <input id="entry" placeholder="Message JARVIS..." autocomplete="off">
    <button class="send" type="submit">Send</button>
  </form>

  <div class="note">Connected to your JARVIS AI service.</div>
</section>
</div>

<nav>
  <button data-tab="HOME">⌂ Home</button>
  <button data-tab="ASSISTANT">◉ Assistant</button>
  <button data-tab="TASKS">✓ Tasks</button>
  <button data-tab="SETTINGS">⚙ Settings</button>
</nav>

<script>
const $ = selector => document.querySelector(selector);

function tick() {
  const d = new Date();
  $('#time').textContent = d.toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit'
  });
  $('#date').textContent = d.toLocaleDateString([], {
    weekday: 'short',
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });
}
tick();
setInterval(tick, 1000);

function add(who, text) {
  const el = document.createElement('div');
  el.className = 'msg';

  const label = document.createElement('div');
  label.className = 'who';
  label.textContent = who;

  const body = document.createElement('div');
  body.textContent = text;

  el.append(label, body);
  $('#conversation').append(el);
  $('#conversation').scrollTop = $('#conversation').scrollHeight;
}

let voiceMode = false;
let busy = false;
let recognition = null;
let restartTimer = null;

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

function status(state, hint) {
  $('#status').textContent = state;
  $('#hint').textContent = hint;
}

function startListening() {
  if (!voiceMode || busy || !recognition) return;

  try {
    recognition.start();
  } catch (error) {
    // Recognition may already be starting.
  }
}

function speak(reply) {
  if (!window.speechSynthesis) {
    busy = false;
    if (voiceMode) setTimeout(startListening, 700);
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(reply);

const voices = window.speechSynthesis.getVoices();
console.log('Available voices:', voices.length);

const britishMaleVoice = voices.find(voice =>
  voice.lang === 'en-GB' &&
  /male|daniel|oliver|arthur/i.test(voice.name)
);

const britishVoice = voices.find(voice =>
  voice.lang === 'en-GB'
);

if (britishMaleVoice) {
  utterance.voice = britishMaleVoice;
} else if (britishVoice) {
  utterance.voice = britishVoice;
}

utterance.lang = 'en-GB';
utterance.rate = 0.92;
utterance.pitch = 0.80;

  utterance.onend = () => {
  busy = false;

  if (voiceMode) {
    status('LISTENING', 'JARVIS is ready for your next message.');

    restartTimer = setTimeout(() => {
      if (voiceMode) {
        startListening();
      }
    }, 1800);

  } else {
    status('SYSTEM ONLINE', 'Tap the microphone to speak.');
  }
};

  utterance.onerror = () => {
    busy = false;
    if (voiceMode) setTimeout(startListening, 1000);
  };

  window.speechSynthesis.speak(utterance);
}

async function sendMessage(message) {
  const text = message.trim();
  if (!text || busy) return;

  busy = true;
  add('YOU', text);
  $('#entry').value = '';
  status('THINKING', 'JARVIS is thinking...');

  try {
    const response = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'AI service error');
    }

    const reply = data.reply || 'I could not generate a reply.';
    add('JARVIS', reply);
    status('SPEAKING', 'JARVIS is speaking...');
speak(reply);

  } catch (error) {
    console.error(error);
    add('JARVIS', 'I could not connect to Gemini. Please try again.');
    busy = false;
    status('CONNECTION ERROR', 'Check the Netlify function and try again.');
    if (voiceMode) setTimeout(startListening, 1500);
  }
}

// Text messages
$('#chat').addEventListener('submit', event => {
  event.preventDefault();
  sendMessage($('#entry').value);
});


// Voice recognition
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'en-ZA';
  recognition.continuous = false;
  recognition.interimResults = false;

  let pendingVoiceMessage = '';

  recognition.onstart = () => {
    document.body.classList.add('listening');
    status('LISTENING', 'I am listening...');
  };

  recognition.onresult = event => {
    pendingVoiceMessage =
      event.results[0][0].transcript.trim();

    recognition.stop();
  };

  recognition.onerror = event => {
    document.body.classList.remove('listening');

    if (event.error === 'not-allowed') {
      voiceMode = false;
      status('MICROPHONE BLOCKED', 'Allow microphone access in Safari.');
    } else if (event.error !== 'no-speech' && voiceMode) {
      status('VOICE ERROR', 'Please try speaking again.');
    }
  };

  recognition.onend = () => {
    document.body.classList.remove('listening');

    if (pendingVoiceMessage) {
      const message = pendingVoiceMessage;
      pendingVoiceMessage = '';

     setTimeout(() => {
  voiceMode = false;
  sendMessage(message);
}, 500);

      return;
    }

    if (voiceMode && !busy) {
      restartTimer = setTimeout(startListening, 700);
    }
  };

} else {
  status('VOICE UNAVAILABLE', 'Use typing or try Safari on iPhone.');
}


// Microphone button
$('#mic').addEventListener('click', () => {
  if (!recognition) {
    status('VOICE UNAVAILABLE', 'Voice recognition is not supported here.');
    return;
  }

  if (voiceMode) {
    voiceMode = false;
    clearTimeout(restartTimer);
    recognition.stop();
    window.speechSynthesis?.cancel();
    busy = false;
    $('#mic').textContent = '🎙';
    status('SYSTEM ONLINE', 'Voice mode stopped.');
  } else {
    voiceMode = true;
    $('#mic').textContent = '■';
    status('LISTENING', 'I am listening...');
    startListening();
  }
});

// Navigation
document.querySelectorAll('nav button').forEach(button => {
  button.addEventListener('click', () => {
    const tab = button.dataset.tab;

    if (tab === 'TASKS') {
      add('JARVIS', 'Tasks panel is not connected yet.');
    } else if (tab === 'SETTINGS') {
      add('JARVIS', 'Voice mode and Gemini connection settings.');
    } else {
      add('JARVIS', tab === 'HOME'
        ? 'Home screen active.'
        : 'Assistant screen active.');
    }
  });
});
</script>
</body>
</html>
